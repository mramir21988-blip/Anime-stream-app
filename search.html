<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search - THRILLING ANIME</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animation.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- Header -->
  <header class="app-header glass-strong">
    <div class="app-header-inner">
      <div class="flex items-center gap-2">
        <h1 class="text-lg font-bold tracking-tight">Search</h1>
      </div>
      <button class="p-2 rounded-xl hover:bg-white/5 transition-colors" onclick="goToPage('home')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="h-14"></div>

  <div class="page-container px-4 pt-4 fade-in-up">
    <!-- Search Input -->
    <div class="relative mb-6">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-white/40" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search anime, movies, series..." autocomplete="off">
    </div>

    <!-- Recent Searches -->
    <div id="recent-searches-container" class="mb-6">
      <h3 class="text-xs font-semibold text-white/50 uppercase tracking-wider mb-3">Recent Searches</h3>
      <div id="recent-searches" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Empty State -->
    <div id="search-empty" class="flex flex-col items-center justify-center py-12 text-center">
      <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white/30">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <p class="text-sm text-white/40">Type to search anime</p>
    </div>

    <!-- Results -->
    <div id="search-results" class="flex flex-col gap-3 pb-6"></div>
  </div>

  <!-- Spacer -->
  <div class="h-20"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav glass-strong">
    <div class="bottom-nav-inner">
      <button class="nav-item" onclick="goToPage('home')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"></path>
        </svg>
        <span class="text-[10px] font-medium">Home</span>
      </button>
      <button class="nav-item active" onclick="goToPage('search')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <span class="text-[10px] font-medium">Search</span>
      </button>
      <button class="nav-item" onclick="goToPage('categories')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span class="text-[10px] font-medium">Categories</span>
      </button>
      <button class="nav-item" onclick="goToPage('profile')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
        </svg>
        <span class="text-[10px] font-medium">Profile</span>
      </button>
    </div>
  </nav>
  
  <script src="../js/theme-helper.js"></script>
  <script src="../js/tmdb.js"></script>
  <script src="../js/app-core.js"></script>
  <script src="../js/app-search.js"></script>
  <script src="../js/search-filters.js"></script>

  <div class="search-filters"></div>  <!-- Filter bar yahan ayega -->
  <div class="search-results"></div>   <!-- Results yahan render honge -->

</body>
</html>
