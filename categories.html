<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Categories - THRILLING ANIME</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animation.css">
  <link rel="stylesheet" href="../css/themes.css">
  <style>
    /* ===== GENRE GRID ===== */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 640px) {
      .genre-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    }
    @media (min-width: 1024px) {
      .genre-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* ===== GENRE CARD V2 ===== */
    .genre-card-v2 {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 16/10;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      contain: layout style paint;
    }
    .genre-card-v2::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--genre-color, var(--accent)) 0%, transparent 70%);
      opacity: 0.15;
      transition: opacity 0.4s ease;
      z-index: 1;
    }
    .genre-card-v2::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
      z-index: 2;
    }
    .genre-card-v2:hover,
    .genre-card-v2:active {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--genre-color, var(--accent));
      box-shadow: 0 8px 32px var(--genre-glow, var(--accent-glow));
    }
    .genre-card-v2:hover::before {
      opacity: 0.35;
    }
    .genre-card-v2 img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }
    .genre-card-v2:hover img {
      transform: scale(1.12);
    }
    .genre-card-v2 .genre-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .genre-card-v2 .genre-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      transition: all 0.3s ease;
    }
    .genre-card-v2:hover .genre-icon-wrap {
      background: var(--genre-color, var(--accent));
      transform: scale(1.1);
    }
    .genre-card-v2 .genre-icon-wrap svg {
      width: 20px;
      height: 20px;
      color: white;
      transition: all 0.3s ease;
    }
    .genre-card-v2:hover .genre-icon-wrap svg {
      color: black;
      stroke-width: 2.5;
    }
    .genre-card-v2 .genre-title {
      font-size: 15px;
      font-weight: 700;
      color: white;
      line-height: 1.2;
    }
    .genre-card-v2 .genre-count {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      margin-top: 2px;
      font-weight: 500;
    }
    .genre-card-v2 .genre-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.3s ease;
    }
    .genre-card-v2:hover .genre-arrow,
    .genre-card-v2:active .genre-arrow {
      opacity: 1;
      transform: translateX(0);
    }
    .genre-card-v2 .genre-arrow svg {
      width: 14px;
      height: 14px;
      color: white;
    }

    /* ===== QUICK FILTERS ===== */
    .quick-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 20px;
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .quick-filters::-webkit-scrollbar { display: none; }
    .quick-filter-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      scroll-snap-align: start;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }
    .quick-filter-btn:active {
      transform: scale(0.95);
    }
    .quick-filter-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ===== SEARCH BAR ===== */
    .category-search-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .category-search-input {
      width: 100%;
      padding: 10px 36px 10px 40px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }
    .category-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .category-search-wrap .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .category-search-wrap .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text-muted);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      transition: all 0.2s ease;
    }
    .category-search-wrap .clear-btn.visible {
      display: flex;
    }
    .category-search-wrap .clear-btn:active {
      background: rgba(255,255,255,0.2);
      transform: translateY(-50%) scale(0.9);
    }

    /* ===== CONTINUE WATCHING ===== */
    .continue-section {
      margin-bottom: 20px;
      animation: fadeInUp 0.5s ease both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .continue-card {
      position: relative;
      width: 140px;
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0;
      transform: translateX(20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .continue-card.visible {
      opacity: 1;
      transform: translateX(0);
    }
    .continue-card .poster {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-md);
      aspect-ratio: 3/4;
      background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
    }
    .continue-card .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .continue-card:hover .poster img {
      transform: scale(1.08);
    }
    .continue-card .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      overflow: hidden;
    }
    .continue-card .progress-fill {
      height: 100%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    .continue-card .title {
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text-primary);
    }
    .continue-card .meta {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .continue-card .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 10px;
      z-index: 5;
    }
    .continue-card:hover .remove-btn,
    .continue-card:active .remove-btn {
      opacity: 1;
    }

    /* ===== HINDI SECTION ===== */
    .hindi-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .hindi-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hindi-section-title h3 {
      font-size: 16px;
      font-weight: 700;
    }
    .hindi-see-all {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      padding: 4px 8px;
      border-radius: 8px;
      user-select: none;
    }
    .hindi-see-all:hover {
      background: var(--accent-glow);
    }
    .hindi-see-all svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
    }
    .hindi-see-all:hover svg {
      transform: translateX(2px);
    }

    /* Horizontal scroll container */
    .h-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .h-scroll::-webkit-scrollbar { display: none; }
    .h-scroll > * {
      scroll-snap-align: start;
    }

    /* ===== SKELETONS ===== */
    .genre-skeleton {
      aspect-ratio: 16/10;
      border-radius: var(--radius-lg);
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .hindi-skeleton-card {
      flex-shrink: 0;
      width: 140px;
    }
    .hindi-skeleton-card .sk-poster {
      aspect-ratio: 3/4;
      border-radius: var(--radius-md);
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 8px;
    }
    .hindi-skeleton-card .sk-text {
      height: 12px;
      border-radius: 4px;
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 6px;
    }
    .hindi-skeleton-card .sk-text.short { width: 60%; height: 10px; }

    /* ===== SECTION HEADER ===== */
    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      margin-top: 24px;
    }
    .section-header-row h2 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      position: relative;
      padding-left: 12px;
    }
    .section-header-row h2::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* ===== PULL TO REFRESH ===== */
    .pull-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .pull-hint.visible {
      opacity: 1;
    }
    .pull-hint svg {
      width: 14px;
      height: 14px;
      transition: transform 0.3s ease;
    }
    .pull-hint.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--bg-secondary);
      border: 1px solid var(--accent);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 30px var(--accent-glow), 0 10px 40px rgba(0,0,0,0.5);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .genre-card-v2, .genre-card-v2 img, .genre-card-v2::before,
      .quick-filter-btn, .hindi-see-all, .genre-arrow,
      .continue-card, .continue-card .progress-fill {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- Header -->
  <header class="app-header glass-strong" id="app-header">
    <div class="app-header-inner">
      <div class="flex items-center gap-2">
        <h1 class="text-lg font-bold tracking-tight">Categories</h1>
      </div>
      <button class="p-2 rounded-xl hover:bg-white/5 transition-colors" onclick="goToPage('home')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="h-14"></div>

  <!-- Pull to refresh hint -->
  <div class="pull-hint" id="pull-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    <span id="pull-text">Pull down to refresh</span>
  </div>

  <div class="page-container px-4 pt-4 fade-in-up" id="page-container">

    <!-- Search -->
    <div class="category-search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
      <input type="text" class="category-search-input" id="genre-search" placeholder="Search genres or filters..." autocomplete="off" autocorrect="off" autocapitalize="off">
      <button class="clear-btn" id="clear-search">✕</button>
    </div>

    <!-- Quick Filters -->
    <div class="quick-filters" id="quick-filters">
      <button class="quick-filter-btn" onclick="goToCategoryView('trending','Trending Now')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
        Trending
      </button>
      <button class="quick-filter-btn" onclick="goToCategoryView('top_rated','Top Rated')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        Top Rated
      </button>
      <button class="quick-filter-btn" onclick="goToCategoryView('new','New Releases')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        New Releases
      </button>
      <button class="quick-filter-btn" onclick="goToCategoryView('hindi','Hindi Dubbed')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        Hindi Dubbed
      </button>
    </div>

    <!-- Continue Watching -->
    <div class="continue-section" id="continue-section" style="display:none;">
      <div class="section-header-row" style="margin-top:0;">
        <h2>Continue Watching</h2>
      </div>
      <div class="h-scroll" id="continue-container"></div>
    </div>

    <!-- Genres Section -->
    <div class="section-header-row">
      <h2>Browse by Genre</h2>
    </div>

    <div class="genre-grid" id="genre-grid">
      <!-- Skeletons while loading -->
      <div class="genre-skeleton"></div>
      <div class="genre-skeleton"></div>
      <div class="genre-skeleton"></div>
      <div class="genre-skeleton"></div>
      <div class="genre-skeleton"></div>
      <div class="genre-skeleton"></div>
      <div class="genre-skeleton"></div>
      <div class="genre-skeleton"></div>
    </div>

    <!-- Hindi Dubbed Section -->
    <div class="section-header-row" style="margin-top: 28px;">
      <div class="hindi-section-title">
        <h3>Hindi Dubbed</h3>

      </div>
      <div class="hindi-see-all" onclick="goToCategoryView('hindi','Hindi Dubbed')">
        See all
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>
    </div>

    <div class="h-scroll" id="hindi-container">
      <div class="hindi-skeleton-card">
        <div class="sk-poster"></div>
        <div class="sk-text"></div>

      </div>
      <div class="hindi-skeleton-card">
        <div class="sk-poster"></div>
        <div class="sk-text"></div>
        <div class="sk-text short"></div>
      </div>
      <div class="hindi-skeleton-card">
        <div class="sk-poster"></div>
        <div class="sk-text"></div>
        <div class="sk-text short"></div>
      </div>
      <div class="hindi-skeleton-card">
        <div class="sk-poster"></div>
        <div class="sk-text"></div>
        <div class="sk-text short"></div>
      </div>
      <div class="hindi-skeleton-card">
        <div class="sk-poster"></div>
        <div class="sk-text"></div>
        <div class="sk-text short"></div>
      </div>
    </div>

  </div>

  <!-- Spacer -->
  <div class="h-20"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav glass-strong">
    <div class="bottom-nav-inner">
      <button class="nav-item" onclick="goToPage('home')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"></path>
        </svg>
        <span class="text-[10px] font-medium">Home</span>
      </button>
      <button class="nav-item" onclick="goToPage('search')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <span class="text-[10px] font-medium">Search</span>
      </button>
      <button class="nav-item active" onclick="goToPage('categories')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span class="text-[10px] font-medium">Categories</span>
      </button>
      <button class="nav-item" onclick="goToPage('profile')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
        </svg>
        <span class="text-[10px] font-medium">Profile</span>
      </button>
    </div>
  </nav>

  <!-- Scripts: ORDER MATTERS -->
  <script src="../js/cache-manager.js"></script>
  <script src="../js/anime-api.js"></script>
  <script src="../js/tmdb.js"></script>
  <script src="../js/theme-helper.js"></script>
  <script src="../js/app-core.js"></script>
  <script src="../js/app-category.js"></script>
  <script>
    // ===== GENRE CONFIG =====
    const GENRES = [
      { name: 'Action', color: '#FF4D4D', glow: 'rgba(255,77,77,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>' },
      { name: 'Adventure', color: '#FF9933', glow: 'rgba(255,153,51,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>' },
      { name: 'Comedy', color: '#FFD700', glow: 'rgba(255,215,0,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>' },
      { name: 'Drama', color: '#FF3366', glow: 'rgba(255,51,102,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line><path d="M16 5c-1.5-1-3.5-1-5 0"></path></svg>' },
      { name: 'Fantasy', color: '#B829DD', glow: 'rgba(184,41,221,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>' },
      { name: 'Romance', color: '#FF66B2', glow: 'rgba(255,102,178,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>' },
      { name: 'Sci-Fi', color: '#00D4FF', glow: 'rgba(0,212,255,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12 2.1 10.5"></path><path d="M12 12v10"></path><path d="M12 12 8 21.7"></path></svg>' },
      { name: 'Thriller', color: '#CC0000', glow: 'rgba(204,0,0,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>' },
      { name: 'Horror', color: '#8B0000', glow: 'rgba(139,0,0,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12 2.1 10.5"></path><path d="M12 12v10"></path></svg>' },
      { name: 'Sports', color: '#00CC66', glow: 'rgba(0,204,102,0.3)', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>' },
    ];

    // Navigate to category view
    function goToCategoryView(type, title) {
      window.location.href = './category-view.html?type=' + encodeURIComponent(type) + '&title=' + encodeURIComponent(title);
    }

    function goToGenreView(genre) {
      window.location.href = './category-view.html?type=genre&genre=' + encodeURIComponent(genre) + '&title=' + encodeURIComponent(genre);
    }

    // Build genre card
    function buildGenreCard(genre, posterUrl, count) {
      const card = document.createElement('div');
      card.className = 'genre-card-v2';
      card.style.setProperty('--genre-color', genre.color);
      card.style.setProperty('--genre-glow', genre.glow);
      card.onclick = () => goToGenreView(genre.name);

      card.innerHTML = '<img src="' + posterUrl + '" alt="' + genre.name + '" loading="lazy" decoding="async" onerror="this.style.display='none'">' +
        '<div class="genre-content">' +
          '<div>' +
            '<div class="genre-icon-wrap">' + genre.icon + '</div>' +
            '<div class="genre-title">' + genre.name + '</div>' +
            '<div class="genre-count">' + count + '+ titles</div>' +
          '</div>' +
          '<div class="genre-arrow">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>' +
          '</div>' +
        '</div>';
      return card;
    }

    // Load genres with real posters using AnimeAPI
    async function loadGenres() {
      const grid = document.getElementById('genre-grid');
      grid.innerHTML = '';

      for (const genre of GENRES) {
        try {
          let posterUrl = 'https://placehold.co/400x250/1a1a2e/' + genre.color.replace('#','') + '?text=' + genre.name;
          let count = '80';

          // Try AnimeAPI for genre poster
          if (typeof AnimeAPI !== 'undefined') {
            try {
              const results = await AnimeAPI.fetchByGenre(genre.name, 1);
              if (results && results.length > 0) {
                posterUrl = results[0].poster || posterUrl;
                count = results.length;
              }
            } catch (e) {
              // Fallback to placeholder
            }
          }

          const card = buildGenreCard(genre, posterUrl, count);
          grid.appendChild(card);

          requestAnimationFrame(() => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(12px)';
            card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            setTimeout(() => {
              card.style.opacity = '1';
              card.style.transform = 'translateY(0)';
            }, GENRES.indexOf(genre) * 80);
          });
        } catch (e) {
          console.warn('Genre load failed:', genre.name, e);
        }
      }
    }

    // Build horizontal anime card
    function buildHindiCard(item) {
      const card = document.createElement('div');
      card.className = 'anime-card card-tap';
      card.style.width = '140px';
      card.onclick = () => {
        if (typeof addToContinueWatching === 'function') {
          addToContinueWatching({
            id: item.id,
            title: item.title,
            poster: item.poster,
            episode: 1,
            progress: 0
          });
        }
        window.location.href = './player.html?id=' + item.id;
      };

      const posterUrl = item.poster || item.poster_path || '';
      const rating = item.rating || (item.vote_average ? item.vote_average.toFixed(1) : '0.0');
      const year = item.year || (item.first_air_date ? item.first_air_date.split('-')[0] : 'N/A');

      card.innerHTML = '<div class="poster">' +
        '<img src="' + posterUrl + '" alt="' + item.title + '" loading="lazy" decoding="async" style="background: linear-gradient(135deg, #1a1a2e, #0f0f1a);">' +
        '<span class="badge-hindi">DUB</span>' +
        '<div class="rating-badge">' +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
          rating +
        '</div>' +
      '</div>' +
      '<div class="title line-clamp-1">' + item.title + '</div>' +
      '<div class="meta">' + year + '</div>';
      return card;
    }

    // Load Hindi dubbed section
    async function loadHindiSection() {
      const container = document.getElementById('hindi-container');
      try {
        let anime = [];
        if (typeof AnimeAPI !== 'undefined') {
          anime = await AnimeAPI.fetchHindiDubbed();
        } else if (typeof FALLBACK_ANIME !== 'undefined') {
          anime = FALLBACK_ANIME.filter(a => a.hindi_dubbed);
        }
        container.innerHTML = '';
        anime.slice(0, 8).forEach((item, idx) => {
          const card = buildHindiCard(item);
          container.appendChild(card);
          card.style.opacity = '0';
          card.style.transform = 'translateX(20px)';
          card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
          setTimeout(() => {
            card.style.opacity = '1';
            card.style.transform = 'translateX(0)';
          }, idx * 100);
        });
      } catch (e) {
        console.error('Hindi section failed:', e);
        container.innerHTML = '<p class="text-xs text-white/40 px-2">Failed to load. Pull down to retry.</p>';
      }
    }

    // ===== CONTINUE WATCHING (localStorage) =====
    function renderContinueWatching() {
      const section = document.getElementById('continue-section');
      const container = document.getElementById('continue-container');
      try {
        const data = JSON.parse(localStorage.getItem('thrilling_continue')) || [];
        const items = data.slice(0, 10);
        if (!items.length) { section.style.display = 'none'; return; }

        section.style.display = '';
        container.innerHTML = '';
        items.forEach((item, idx) => {
          const card = document.createElement('div');
          card.className = 'continue-card';
          card.innerHTML = '<div class="poster">' +
            '<img src="' + (item.poster || '') + '" alt="' + item.title + '" loading="lazy" decoding="async" onerror="this.style.opacity=0">' +
            '<div class="progress-track"><div class="progress-fill" style="width:' + (item.progress || 0) + '%"></div></div>' +
            '<button class="remove-btn" onclick="event.stopPropagation();removeContinue(' + item.id + ')">✕</button>' +
          '</div>' +
          '<div class="title">' + item.title + '</div>' +
          '<div class="meta">Ep ' + (item.episode || 1) + '</div>';
          card.onclick = () => { window.location.href = './player.html?id=' + item.id; };
          container.appendChild(card);
          requestAnimationFrame(() => {
            setTimeout(() => card.classList.add('visible'), idx * 80);
          });
        });
      } catch (e) {
        section.style.display = 'none';
      }
    }

    function removeContinue(id) {
      try {
        let data = JSON.parse(localStorage.getItem('thrilling_continue')) || [];
        data = data.filter(i => i.id !== id);
        localStorage.setItem('thrilling_continue', JSON.stringify(data));
        renderContinueWatching();
        showToast('Removed from continue watching');
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ===== GENRE SEARCH =====
    const genreSearch = document.getElementById('genre-search');
    const clearBtn = document.getElementById('clear-search');
    if (genreSearch) {
      genreSearch.addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        clearBtn.classList.toggle('visible', q.length > 0);
        document.querySelectorAll('.genre-card-v2').forEach(card => {
          const title = card.querySelector('.genre-title')?.textContent?.toLowerCase() || '';
          card.style.display = title.includes(q) ? '' : 'none';
        });
        document.querySelectorAll('.quick-filter-btn').forEach(btn => {
          const text = btn.textContent.trim().toLowerCase();
          btn.style.display = text.includes(q) ? '' : 'none';
        });
      });
      clearBtn.addEventListener('click', () => {
        genreSearch.value = '';
        clearBtn.classList.remove('visible');
        document.querySelectorAll('.genre-card-v2, .quick-filter-btn').forEach(el => el.style.display = '');
        genreSearch.blur();
      });
      genreSearch.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') clearBtn.click();
      });
    }

    // ===== PULL TO REFRESH =====
    (function initPullRefresh() {
      const container = document.getElementById('page-container');
      const hint = document.getElementById('pull-hint');
      const hintText = document.getElementById('pull-text');
      if (!container) return;
      let startY = 0, pulling = false, atTop = false;

      container.addEventListener('touchstart', (e) => {
        atTop = window.scrollY <= 5;
        if (!atTop) return;
        startY = e.touches[0].clientY;
        pulling = true;
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (!pulling || !atTop) return;
        const diff = e.touches[0].clientY - startY;
        if (diff > 0 && diff < 180) {
          if (diff > 20) e.preventDefault();
          container.style.transform = 'translateY(' + (diff * 0.35) + 'px)';
          if (hint) {
            hint.classList.add('visible');
            hint.style.opacity = Math.min(diff / 60, 1);
          }
        }
      }, { passive: false });

      container.addEventListener('touchend', () => {
        if (!pulling) return;
        const ev = window.event;
        const diff = (ev && ev.changedTouches) ? ev.changedTouches[0].clientY - startY : 0;
        container.style.transition = 'transform 0.3s ease';
        container.style.transform = 'translateY(0)';
        setTimeout(() => { container.style.transition = ''; }, 300);

        if (diff > 80 && atTop) {
          if (hint) { hint.classList.add('spinning'); if(hintText) hintText.textContent = 'Refreshing...'; }
          Promise.all([loadGenres(), loadHindiSection()]).then(() => {
            renderContinueWatching();
            if (hint) { hint.classList.remove('spinning', 'visible'); if(hintText) hintText.textContent = 'Pull down to refresh'; }
            showToast('Categories refreshed');
          }).catch(() => {
            if (hint) { hint.classList.remove('spinning', 'visible'); if(hintText) hintText.textContent = 'Pull down to refresh'; }
            showToast('Refresh failed');
          });
        } else {
          if (hint) hint.classList.remove('visible');
        }
        pulling = false;
      });
    })();

    // ===== STICKY HEADER =====
    (function initStickyHeader() {
      const header = document.getElementById('app-header');
      if (!header) return;
      let lastScroll = 0;
      window.addEventListener('scroll', () => {
        const current = window.scrollY;
        if (current > lastScroll && current > 80) {
          header.style.transform = 'translateY(-100%)';
        } else {
          header.style.transform = 'translateY(0)';
        }
        lastScroll = current;
      }, { passive: true });
    })();

    // ===== GENRE PREFETCH =====
    function initGenrePrefetch() {
      document.querySelectorAll('.genre-card-v2').forEach(card => {
        const handler = () => {
          const genre = card.querySelector('.genre-title')?.textContent;
          if (genre) {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = './category-view.html?type=genre&genre=' + encodeURIComponent(genre) + '&title=' + encodeURIComponent(genre);
            document.head.appendChild(link);
          }
          card.removeEventListener('mouseenter', handler);
          card.removeEventListener('touchstart', handler);
        };
        card.addEventListener('mouseenter', handler);
        card.addEventListener('touchstart', handler, { passive: true });
      });
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      loadGenres().then(() => initGenrePrefetch());
      loadHindiSection();
      renderContinueWatching();
      if (window.CategorySystem) CategorySystem.initCategoriesPage();
    });
  </script>
