<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch History - THRILLING ANIME</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animation.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- Header -->
  <header class="app-header glass-strong">
    <div class="app-header-inner">
      <button class="p-2 rounded-xl hover:bg-white/5 transition-colors" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <h1 class="text-lg font-bold tracking-tight absolute left-1/2 -translate-x-1/2">Watch History</h1>
      <button class="p-2 rounded-xl hover:bg-white/5 transition-colors" onclick="showToast('Edit mode coming soon')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="h-14"></div>

  <div id="history-full-page" class="page-container px-4 pt-4 pb-8 fade-in-up">
    <div id="history-full-list">
      <!-- JS will populate -->
    </div>
  </div>

  <!-- Spacer -->
  <div class="h-20"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav glass-strong">
    <div class="bottom-nav-inner">
      <button class="nav-item" onclick="goToPage('home')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"></path>
        </svg>
        <span class="text-[10px] font-medium">Home</span>
      </button>
      <button class="nav-item" onclick="goToPage('search')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <span class="text-[10px] font-medium">Search</span>
      </button>
      <button class="nav-item" onclick="goToPage('categories')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span class="text-[10px] font-medium">Categories</span>
      </button>
      <button class="nav-item" onclick="goToPage('profile')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
        </svg>
        <span class="text-[10px] font-medium">Profile</span>
      </button>
    </div>
  </nav>

  <script src="../js/tmdb.js"></script>
  <script src="../js/app-core.js"></script>
  <script src="../js/app-profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (document.getElementById('history-full-page')) {
        loadFullWatchHistory();
      }
    });
  </script>
</body>
</html>
