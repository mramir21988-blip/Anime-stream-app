<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feedback - THRILLING ANIME</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animation.css">
  <link rel="stylesheet" href="../css/profile-improvements.css">
  <style>
    .fb-section-title { font-size:15px; font-weight:600; color:var(--text-primary); margin-bottom:12px; }
    .fb-card { background:var(--bg-card); border:1px solid var(--border-card); border-radius:16px; overflow:hidden; }
    .fb-option { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; cursor:pointer; transition:background 0.15s; border-bottom:1px solid var(--border-card); }
    .fb-option:last-child { border-bottom:none; }
    .fb-option:active { background:var(--bg-hover); }
    .fb-option-text { font-size:15px; color:var(--text-primary); }
    .fb-radio { width:22px; height:22px; border-radius:50%; border:2px solid var(--text-muted); display:flex; align-items:center; justify-content:center; transition:all 0.2s; flex-shrink:0; }
    .fb-radio.active { border-color:var(--accent); background:var(--accent); }
    .fb-radio.active::after { content:''; width:8px; height:8px; border-radius:50%; background:#000; }
    .fb-textarea-wrap { padding:16px; }
    .fb-textarea { width:100%; min-height:120px; background:transparent; border:none; color:var(--text-primary); font-size:14px; line-height:1.5; resize:none; outline:none; }
    .fb-textarea::placeholder { color:var(--text-muted); }
    .fb-char-count { text-align:right; font-size:12px; color:var(--text-muted); margin-top:4px; }
    .fb-screenshot { display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:1px solid var(--border-card); cursor:pointer; }
    .fb-screenshot-icon { width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:center; }
    .fb-screenshot-text { font-size:13px; color:var(--text-muted); }
    .fb-submit { width:100%; padding:14px; border-radius:12px; background:var(--accent); color:var(--text-inverse); font-size:15px; font-weight:700; border:none; cursor:pointer; transition:all 0.2s; margin-top:20px; }
    .fb-submit:active { transform:scale(0.98); opacity:0.9; }
    .fb-submit:disabled { opacity:0.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="app-header glass-strong">
    <div class="app-header-inner">
      <button class="p-2 rounded-xl hover:bg-white/5 transition-colors" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="text-lg font-bold tracking-tight">Feedback</h1>
      <div class="w-10"></div>
    </div>
  </header>

  <div class="h-14"></div>

  <div class="page-container px-4 pt-4 pb-8">

    <div class="mb-5">
      <h2 class="fb-section-title">What's your feedback about?</h2>
      <div class="fb-card">
        <div class="fb-option" onclick="selectFeedback(this, 'viewing')">
          <span class="fb-option-text">Viewing Experience</span>
          <div class="fb-radio" data-value="viewing"></div>
        </div>
        <div class="fb-option" onclick="selectFeedback(this, 'subtitles')">
          <span class="fb-option-text">Subtitles</span>
          <div class="fb-radio" data-value="subtitles"></div>
        </div>
        <div class="fb-option" onclick="selectFeedback(this, 'download')">
          <span class="fb-option-text">Download</span>
          <div class="fb-radio" data-value="download"></div>
        </div>
        <div class="fb-option" onclick="selectFeedback(this, 'file-management')">
          <span class="fb-option-text">File Management</span>
          <div class="fb-radio" data-value="file-management"></div>
        </div>
        <div class="fb-option" onclick="selectFeedback(this, 'copyright')">
          <span class="fb-option-text">Infringement of my copyright or IP</span>
          <div class="fb-radio" data-value="copyright"></div>
        </div>
        <div class="fb-option" onclick="selectFeedback(this, 'other')">
          <span class="fb-option-text">Other</span>
          <div class="fb-radio" data-value="other"></div>
        </div>
      </div>
    </div>

    <div class="mb-5">
      <h2 class="fb-section-title">Tell us a little more (Optional)</h2>
      <div class="fb-card">
        <div class="fb-textarea-wrap">
          <textarea class="fb-textarea" id="feedback-text" placeholder="Please describe the issue in detail, and if it's about a TV series, specify the season and episode number." maxlength="500" oninput="updateCharCount(this)"></textarea>
          <div class="fb-char-count"><span id="char-count">0</span>/500</div>
        </div>
        <div class="fb-screenshot" onclick="document.getElementById('screenshot-input').click()">
          <div class="fb-screenshot-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>
          <span class="fb-screenshot-text">For better assistance, please provide a screenshot.</span>
          <input type="file" id="screenshot-input" accept="image/*" hidden onchange="handleScreenshot(this)">
        </div>
        <div id="screenshot-preview" style="display:none; padding:0 16px 12px;">
          <img id="screenshot-img" style="width:100%; max-height:200px; object-fit:cover; border-radius:10px;">
        </div>
      </div>
    </div>

    <button class="fb-submit" onclick="submitFeedback()" id="submit-btn">Submit</button>

  </div>

  <div class="h-20"></div>

  <script src="../js/app-core.js"></script>
  <script>
    let selectedType = '';
    let screenshotData = null;

    function selectFeedback(el, type) {
      document.querySelectorAll('.fb-radio').forEach(r => r.classList.remove('active'));
      el.querySelector('.fb-radio').classList.add('active');
      selectedType = type;
    }

    function updateCharCount(el) {
      document.getElementById('char-count').textContent = el.value.length;
    }

    function handleScreenshot(input) {
      const file = input.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showToast('Image must be under 5MB');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        screenshotData = e.target.result;
        document.getElementById('screenshot-img').src = screenshotData;
        document.getElementById('screenshot-preview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function submitFeedback() {
      if (!selectedType) {
        showToast('Please select a feedback type');
        return;
      }
      const text = document.getElementById('feedback-text').value;
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      // Store in localStorage (backend will sync)
      const feedback = {
        type: selectedType,
        text: text,
        screenshot: screenshotData,
        timestamp: new Date().toISOString(),
        user: JSON.parse(localStorage.getItem('thrilling_user') || '{}')
      };

      let history = JSON.parse(localStorage.getItem('thrilling_feedback') || '[]');
      history.push(feedback);
      localStorage.setItem('thrilling_feedback', JSON.stringify(history));

      setTimeout(() => {
        showToast('Feedback submitted! Thank you.');
        btn.disabled = false;
        btn.textContent = 'Submit';
        // Reset form
        selectedType = '';
        screenshotData = null;
        document.querySelectorAll('.fb-radio').forEach(r => r.classList.remove('active'));
        document.getElementById('feedback-text').value = '';
        document.getElementById('char-count').textContent = '0';
        document.getElementById('screenshot-preview').style.display = 'none';
      }, 800);
    }
  </script>
</body>
</html>
